name: release-sas

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-sas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-sas:
    if: github.server_url == 'https://github.com' && vars.DELL_RELEASES_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: [self-hosted, linux, x64, budgero-build]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release ref and tools
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          test "$GITHUB_REF_NAME" = "$expected_tag"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$expected_tag")"
          git merge-base --is-ancestor HEAD origin/master
          docker buildx version

      - name: Isolate credential files
        shell: bash
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-auth" >> "$GITHUB_ENV"
          echo "CLOUDSDK_CONFIG=$RUNNER_TEMP/gcloud-config" >> "$GITHUB_ENV"

      - name: Verify publication credentials
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          for key in DOCKER_TOKEN VITE_CLERK_PUBLISHABLE_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "Missing production secret: $key" >&2
              exit 1
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/server/go.mod

      - name: Scan dependencies
        run: pnpm run security:deps

      - name: Scan Go dependencies
        run: pnpm run security:go

      - name: Release SaaS image
        run: pnpm run release:sas
        env:
          DOCKER_USERNAME: budgero
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          DOCKER_PLATFORMS: linux/amd64
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

      - name: Remove local authentication files
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/docker-auth" "$RUNNER_TEMP/gcloud-config"
